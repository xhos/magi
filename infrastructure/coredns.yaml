# k3s ships coredns as a plain manifest without a replicas field, so flux
# patches just that one field via server-side apply. never prune it: the
# deployment belongs to k3s, flux only co-owns spec.replicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  replicas: 2 # k3s's manifest already spreads these across nodes
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: coredns
  namespace: kube-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      k8s-app: kube-dns
