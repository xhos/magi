apiVersion: apps/v1
kind: Deployment
metadata:
  name: xhos-dev
spec:
  replicas: 2
  selector:
    matchLabels: {app: xhos-dev}
  template:
    metadata:
      labels: {app: xhos-dev}
    spec:
      securityContext:
        runAsNonRoot: true # refuse to start if the image would run as root
        runAsUser: 65534 # nobody; the image has no users of its own
      containers:
        - name: web
          image: git.xhos.dev/xhos/xhos.dev:main-20261026004940-e803c2a # {"$imagepolicy": "xhos-dev:xhos-dev"}
          ports: [{containerPort: 8080}]
          readinessProbe: # not added to the Service until / answers
            httpGet: {path: /, port: 8080}
          resources:
            requests: {cpu: 10m, memory: 16Mi} # what the scheduler reserves on a node
            limits: {memory: 64Mi} # hard cap, killed (OOM) above this
