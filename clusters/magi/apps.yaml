apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m # re-apply even without new commits, which undoes manual drift
  path: ./apps
  prune: true # deleted from git = deleted from cluster
  wait: true # only report Ready once everything it applied is healthy
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: flux-system # created by bootstrap, points at this repo
